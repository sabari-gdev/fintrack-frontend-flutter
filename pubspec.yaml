name: fintrack_mobile
description: "Personal Finance Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.0

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0

  # Routing
  go_router: ^17.0.1

  # UI/UX
  google_fonts: ^8.0.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true